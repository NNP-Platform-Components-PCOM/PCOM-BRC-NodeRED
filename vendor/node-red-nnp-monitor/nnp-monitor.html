<script type="text/html" data-template-name="nnp-monitor">
    <div class="form-row node-input-target-row">
        <button id="node-input-complete-target-select" class="red-ui-button" data-i18n="common.label.selectNodes"></button>
    </div>
    <div class="form-row node-input-target-row node-input-target-list-row" style="position: relative; min-height: 100px">
        <div style="position: absolute; top: -30px; right: 0;"><input type="text" id="node-input-complete-target-filter"></div>
        <div id="node-input-complete-target-container-div"></div>
    </div>

   
    <div class="form-row">
        <label for="node-input-reciever"><i class="fa fa-tag"></i> <span data-i18n="complete.receiver"></span></label>
        <select  id="node-input-receiver" placeholder="Select Receiver" style="width: calc(100% - 105px)"  >
            <option value="">NONE</option>  
            <option value="AMQP">MQ (via AMQP)</option>    
            <option value="REST">API (via REST)</option>    
            <option value="DB_PG">DB (in Postgres)</option>    
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>


</script>
<script type="text/javascript">
    RED.nodes.registerType('nnp-monitor', {
        category: 'NNP',
        color: "#00a8db",
        defaults: {
            name: { value: "nnp-monitor" },
            scope: { value: [], type: "*[]" },
            uncaught: { value: false },
            nodes: { value: {} },
            receiver: { value: "" }
        },
        inputs: 0,
        outputs: 0,
        icon: "nnp.png",
        label: function () {
            if (this.name) {
                return this.name;
            }
            // return this._("complete.completeNodes",{number:this.scope.length});
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function () {
            var node = this;
            var scope = node.scope || [];
            // var nodes  { value: {} },

            this._resize = function () {
                var rows = $("#dialog-form>div:not(.node-input-target-list-row)");
                var height = $("#dialog-form").height();
                for (var i = 0; i < rows.length; i++) {
                    height -= $(rows[i]).outerHeight(true);
                }
                var editorRow = $("#dialog-form>div.node-input-target-list-row");
                editorRow.css("height", height + "px");
            };
            var search = $("#node-input-complete-target-filter").searchBox({
                style: "compact",
                delay: 300,
                change: function () {
                    var val = $(this).val().trim().toLowerCase();
                    if (val === "") {
                        dirList.treeList("filter", null);
                        search.searchBox("count", "");
                    } else {
                        var count = dirList.treeList("filter", function (item) {
                            return item.label.toLowerCase().indexOf(val) > -1 || item.node.type.toLowerCase().indexOf(val) > -1
                        });
                        search.searchBox("count", count + " / " + candidateNodes.length);
                    }
                }
            });

            var dirList = $("#node-input-complete-target-container-div").css({ width: "100%", height: "100%" })
                .treeList({ multi: true }).on("treelistitemmouseover", function (e, item) {
                    item.node.highlighted = true;
                    item.node.dirty = true;
                    RED.view.redraw();
                }).on("treelistitemmouseout", function (e, item) {
                    item.node.highlighted = false;
                    item.node.dirty = true;
                    RED.view.redraw();
                })
            var candidateNodes = RED.nodes.filterNodes({ z: node.z });
            var allChecked = true;
            var items = [];
            var nodeItemMap = {};

            candidateNodes.forEach(function (n) {
                if (n.id === node.id) {
                    return;
                }
                var isChecked = scope.indexOf(n.id) !== -1;

                allChecked = allChecked && isChecked;

                var nodeDef = RED.nodes.getType(n.type);
                var label;
                var sublabel;
                if (nodeDef) {
                    var l = nodeDef.label;
                    label = (typeof l === "function" ? l.call(n) : l) || "";
                    sublabel = n.type;
                    if (sublabel.indexOf("subflow:") === 0) {
                        var subflowId = sublabel.substring(8);
                        var subflow = RED.nodes.subflow(subflowId);
                        sublabel = "subflow : " + subflow.name;
                    }
                }
                if (!nodeDef || !label) {
                    label = n.type;
                }
                nodeItemMap[n.id] = {
                    node: n,
                    id: n.id,
                    label: label,
                    sublabel: sublabel,
                    selected: isChecked,
                    checkbox: true
                };
                items.push(nodeItemMap[n.id]);
            });

            dirList.treeList('data', items);

            $("#node-input-complete-target-select").on("click", function (e) {
                e.preventDefault();
                var preselected = dirList.treeList('selected').map(function (n) { return n.node.id });
                RED.tray.hide();
                RED.view.selectNodes({
                    selected: preselected,
                    onselect: function (selection) {
                        RED.tray.show();
                        var newlySelected = {};
                        selection.forEach(function (n) {
                            newlySelected[n.id] = true;
                            if (nodeItemMap[n.id]) {
                                nodeItemMap[n.id].treeList.select(true);
                            }
                        })
                        preselected.forEach(function (id) {
                            if (!newlySelected[id]) {
                                nodeItemMap[id].treeList.select(false);
                            }
                        })
                    },
                    oncancel: function () {
                        RED.tray.show();
                    },
                    filter: function (n) {
                        return n.id !== node.id;
                    }
                });
            });





        },
        oneditsave: function () {
            var nodes = {};
            // console.log(this.nodes);

            this.receiver = $('#node-input-receiver').val();
            this.scope = $("#node-input-complete-target-container-div").treeList('selected').map(function (i) {
                nodes[i.id] = {
                    label: i.label
                };
                //   console.log(i);
                return i.node.id;
            });
            this.nodes = nodes;
            // console.log(this.nodes);
            // console.log(this.receiver);
        },
        oneditresize: function (size) {
            this._resize();
        }
    });

    // RED.events.on("nodes:add", function (node) {
    //     console.log(node);
    //     // console.log(node.nodes);
       
    //     if(node.type == 'nnp-monitor' && node.nodes && Object.keys(node.nodes).length > 0){
    //         console.log("clearing");
    //         node.nodes = {};
    //     }
    //     console.log(node);
    // })

</script>

</script>
